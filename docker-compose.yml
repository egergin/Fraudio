services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: backend/src/Fraudio.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_CONNECTION: ${POSTGRES_CONNECTION}
      REDIS_CONNECTION: ${REDIS_CONNECTION}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD}
      # Demo işlem üreteci — varsayılan olarak kapalı, .env üzerinden açılır.
      DEMO_TRANSACTION_GENERATOR_ENABLED: ${DEMO_TRANSACTION_GENERATOR_ENABLED:-false}
      DEMO_TRANSACTION_INTERVAL_MINUTES: ${DEMO_TRANSACTION_INTERVAL_MINUTES:-30}
      DEMO_TRANSACTION_MIN_AMOUNT: ${DEMO_TRANSACTION_MIN_AMOUNT:-10}
      DEMO_TRANSACTION_MAX_AMOUNT: ${DEMO_TRANSACTION_MAX_AMOUNT:-5000}
      DEMO_TRANSACTION_LOCATIONS: ${DEMO_TRANSACTION_LOCATIONS:-}
      DEMO_TRANSACTION_RUN_ON_STARTUP: ${DEMO_TRANSACTION_RUN_ON_STARTUP:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]
  mcp:
    build: ./mcp
    environment:
      BACKEND_URL: http://backend:8080
      MCP_USERNAME: ${ADMIN_USERNAME}
      MCP_PASSWORD: ${ADMIN_PASSWORD}
    depends_on: [backend]
volumes:
  postgres-data:
